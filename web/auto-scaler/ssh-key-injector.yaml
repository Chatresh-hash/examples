apiVersion: v1
kind: ConfigMap
metadata:
  name: ssh-keys-config
  namespace: kube-system
data:
  authorized_keys: |
    ssh-rsa  Chatresh-hash
    # You can add multiple keys here, one per line
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ssh-key-injector
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: ssh-key-injector
  template:
    metadata:
      labels:
        name: ssh-key-injector
    spec:
      hostPID: true
      hostNetwork: true
      containers:
      - name: ssh-key-injector
        image: busybox:latest
        command:
        - sh
        - -c
        - |
          cat /config/authorized_keys >> /hosthome/opc/.ssh/authorized_keys
        volumeMounts:
        - name: hosthome
          mountPath: /hosthome
        - name: sshkeys
          mountPath: /config
      volumes:
      - name: hosthome
        hostPath:
          path: /home
      - name: sshkeys
        configMap:
          name: ssh-keys-config
      restartPolicy: Always
